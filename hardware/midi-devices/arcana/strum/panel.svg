<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="group" aria-labelledby="arcana-strum-panel--title" aria-describedby="arcana-strum-panel--description" data-device="arcana-strum" style="background: #fff; color: #334155;" data-diagram-style="wireframe">
  <title id="arcana-strum-panel--title">Arcana Strum overhead hardware diagram</title>
  <desc id="arcana-strum-panel--description">Wireframe top-down schematic; positions are approximate. Each physical control has a stable device-prefixed ID and data-part name. Buttons in this standalone drawing are disabled until a host adds input handlers. Transparent regions marked data-surface-control correspond to the profile MIDI hit areas; multiple regions can share one context-dependent physical control.</desc>
  <style>text { font-family: Arial, sans-serif; } .section-label { font-size: 11px; letter-spacing: 1px; } [data-part]:focus-visible { outline: 3px solid currentColor; }</style>
  <g id="arcana-strum-panel--chassis" aria-hidden="true">
    <rect x="3" y="3" width="1094" height="644" rx="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="22" y="28" fill="currentColor" font-size="19" stroke="none">Arcana Strum</text>
    <ellipse cx="170" cy="200" rx="145" ry="135" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="940" cy="200" r="135" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 940 105 V 295 M 845 200 H 1035" fill="none" stroke="currentColor" stroke-dasharray="5 5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="810" y="133" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="810" y="157" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="810" y="181" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="810" y="205" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="810" y="229" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="810" y="253" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="395" class="section-label" fill="currentColor" stroke="none">UNDERSIDE CONTROLS (SHOWN SEPARATELY)</text>
    <rect x="25" y="415" width="1050" height="210" rx="10" fill="none" stroke="currentColor" stroke-dasharray="6 6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
